# The relay runs one maintenance worker. Requests are serialised through
# it so field tooling sees a stable bay between successive probes.
<IfModule mpm_prefork_module>
    StartServers             1
    MinSpareServers          1
    MaxSpareServers          1
    MaxRequestWorkers        1
    ServerLimit              1
    MaxConnectionsPerChild   0
</IfModule>
KeepAlive Off
