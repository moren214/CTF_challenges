fingerprints:
- 先发一个 6MB 的 big 字段请求把 memory_limit=16M 打爆，触发 OOM bailout；
- bailout 过程中 $_SESSION 的 PS(id) 变成悬垂指针，下一个请求里被 url_encode/Set-Cookie 序列化时发生越界读；
- '响应里的 Set-Cookie: PHPSESSID=<二进制> 中出现大量堆指针，按 2MB 对齐取众数（≥8 次命中）即 chunk base。'
