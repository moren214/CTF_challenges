<VirtualHost *:80>
	ServerAdmin webmaster@memtrace.local
	DocumentRoot /v

	# ------------------------------------------------------------------
	# MemTrace 请求过滤器（蓝队加固，2026-11）
	# 1) 拒绝携带已知公开利用工具固定 multipart boundary 的请求；
	# 2) 拒绝已知 8.4 式回收路径所依赖的 32 字符会话 Cookie；
	# 3) 拒绝自称公开利用工具的 User-Agent。
	# ------------------------------------------------------------------
	RewriteEngine On
	RewriteCond %{HTTP:Content-Type} boundary=SSSSSSSSSSSSSSSSS [OR]
	RewriteCond %{HTTP:Content-Type} boundary=BBBBBBBBBB [OR]
	RewriteCond %{HTTP:Content-Type} boundary=BNDRY12345 [OR]
	RewriteCond %{HTTP:Cookie} ^PHPSESSID=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa$ [OR]
	RewriteCond %{HTTP:User-Agent} ^php2shell
	RewriteRule ^ - [F]

	<Directory /v>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
