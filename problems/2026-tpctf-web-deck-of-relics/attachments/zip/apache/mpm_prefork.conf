# Deck of Relics — the eight attendants.
# Requests are never recycled mid-delivery; a client line holds exactly one
# attendant for as long as its request is in flight, and an attendant that
# collapses is replaced by a fresh hire at the same desk.
KeepAlive Off
<IfModule mpm_prefork_module>
	StartServers 8
	MinSpareServers 8
	MaxSpareServers 8
	ServerLimit 8
	MaxRequestWorkers 8
	MaxConnectionsPerChild 0
</IfModule>
