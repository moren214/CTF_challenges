; Deck of Relics — house rules for PHP.
; Mirrors the intake-conveyor baseline the attendants were trained on:
; the conveyor (RFC 1867 progress bookkeeping) is on, keepsake tokens are
; accepted and handed back, and the attendants show their diagnostics.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
memory_limit = 16M
post_max_size = 32M
upload_max_filesize = 32M
expose_php = Off
session.save_path = /tmp
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
