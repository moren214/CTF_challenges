fingerprints:
- 第一处检查用的是缩容前的 vlen，pos+size <= 0x1F000 通过；
- 而 abuf->data 仍是原 0x1F000 字节块（realloc 收缩后原块被 free），于是 ptr = data + pos 对已释放的旧后备存储做 OOB 读写。
- L1 读 data+0x18 自校准，返回写 s.len 的位置（0x20 或 0x1010）；
