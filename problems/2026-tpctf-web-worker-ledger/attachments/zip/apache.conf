# Two prefork workers; a persistent HTTP connection pins a request pair to one.
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 10
<IfModule mpm_prefork_module>
    StartServers           2
    MinSpareServers        2
    MaxSpareServers        2
    MaxRequestWorkers      2
    ServerLimit            2
    MaxConnectionsPerChild 0
</IfModule>
