# DropVault runs on a memory-constrained box: keep exactly one long-lived
# prefork child and close connections between requests.
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    ServerLimit 1
    MaxConnectionsPerChild 0
</IfModule>
