; DropVault PHP overrides (app role)
; Dev-facing diagnostics are kept on for the ops status board.
display_errors=On
display_startup_errors=On
error_reporting=E_ALL
; Memory profile of the tiny app role: requests are parsed under a small
; per-request budget, well below the request size ceiling.
memory_limit=16M
post_max_size=32M
upload_max_filesize=32M
; Session defaults of the role.
session.save_path=/tmp
session.use_strict_mode=0
session.use_cookies=1
session.upload_progress.enabled=On
session.upload_progress.cleanup=On
; Fatal-error stack output is disabled in production; the ops board reads
; the runtime settings directly instead.
fatal_error_backtraces=0
expose_php=0
