# The ingress accepts POST bodies without a Content-Length field. Apache
# performs this check before PHP parses the multipart request.
<Directory /var/www/html>
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteCond %{HTTP:Content-Length} !^$
    RewriteRule ^ - [F]
</Directory>
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
